<!DOCTYPE html>
<html>
<head>
    <title>To-Do Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>To-Do Application</h2>

        <form action="/submittodoitem" method="POST">

            <label>Item Name</label>
            <input
                type="text"
                name="itemName"
                placeholder="Enter item name"
                required
            >

            <label>Item Description</label>
            <textarea
                name="itemDescription"
                placeholder="Enter item description"
                rows="4"
                required
            ></textarea>

            <button type="submit">Submit To-Do Item</button>

        </form>

    </div>

</body>
</html>
